# Codegen fixes for default.xex (Skylanders: Swap Force, Xbox 360).
# Keys use the same schema as the manifest's [entrypoint] table.
# Every entry (or group of same-reason entries) needs a comment: what's at the address, how it was
# found, and why the fix is safe. Addresses from GiantsRecomp do NOT apply to this XEX.
#
# Entries are added in Phase 1 as codegen and the runtime report them.

[functions]
# Function start only reached by a tail-call branch (b 0x82F60BD8 at 0x82515C04), so the analyzer
# never registered it. Found from the first codegen run: "UnresolvedCall ... target not in any
# function". What the function does is not identified yet; no size given, the analyzer finds the end.
0x82F60BD8 = {}

# 0x83081EB8 is in BinkOpen (sub_83081CE8), right after it reads the 44-byte Bink header into
# r1+112 and just before the signature compares (KB2f, KB2g, BIKf..BIKi). Found from the "Not a Bink
# file." / "Error reading Bink header." string references in that function. src/hooks/
# intro_skip_hook.cpp shortens the logo movies (and, optionally, the opening movie) to one frame.
[[midasm_hook]]
address = 0x83081EB8
name = "BinkHeaderLoaded"
registers = ["r1"]

# 0x82F5C258 queues a D3D swap (called from the game's present path); r3 is the swap word, bits 8-11
# are the presentation interval (2 = 30 FPS). Found by stack-walking the waiting main thread to the
# D3D swap queue and reading the vblank handler sub_82F5C128. src/hooks/frame_rate_hook.cpp can
# override the interval (present_interval setting, off by default).
[[midasm_hook]]
address = 0x82F5C258
name = "SwapIntervalHook"
registers = ["r3"]

# 0x82B8E340 computes the FXAA sample offsets (CFxaaParametersAttr: quality / console / 360 rcp
# frame) from the frame size in f1 (width) and f2 (height); the game passes 1040x620. Found with a
# RenderDoc capture (the FXAA pass's constants) and a write watch on the attr fields, which hit
# only this function. src/hooks/fxaa_scale_hook.cpp multiplies f1/f2 by the draw resolution scale
# so the game's FXAA samples one host pixel apart at resolution_scale 2 and up; it only changes the
# two inputs of a function that writes nothing but the attr.
[[midasm_hook]]
address = 0x82B8E340
name = "FxaaFrameSizeHook"
registers = ["f1", "f2"]

# 0x8258EBE8 computes an igRenderTarget's size (r3 = the target): its own _width/_height (+0x20,
# +0x24) or its parent's or the back buffer's, times its scales, into +0x58/+0x5C. Found with a
# write watch on the 360 pipeline's mainScene (1040x620, parsed from outdoor_shading_xenon.igx):
# this function is the only reader. src/hooks/scene_size_hook.cpp swaps in scene_size for a target
# that says 1040x620 (off unless scene_size is set; experimental, #41).
[[midasm_hook]]
address = 0x8258EBE8
name = "SceneSizeHook"
registers = ["r3"]

# 0x82593B04 follows lis r5,0x20 in sub_82593AD0, which plans the frame's EDRAM use: r5 = 0x200000
# is the size of the planning heap (2048 tiles of 1024 bytes) handed to its init call (bctrl at
# 0x82593B14). Found by following the targets' _overrideBase / _edramBase writer (sub_825939E0) back
# to the allocation (sub_82593870 -> sub_82472370) and this heap. src/hooks/scene_size_hook.cpp
# makes it 4096 tiles when the SDK runs a 4096-tile EDRAM, so a larger scene keeps its planned
# layout; r5 is only that argument.
[[midasm_hook]]
address = 0x82593B04
name = "EdramHeapSizeHook"
registers = ["r5"]

# 0x82513A08 is cmpwi cr6,r5,0x800 in sub_825138F8, which adds up a render pass's EDRAM tiles (r5)
# and above 2048 cuts the screen into predicated-tiling strips (the G-buffer at 1280x720: 2880
# tiles, strips of 880 and 400 pixels, which the SDK doesn't emulate well: black scene). Found by
# logging the failing resolve (depth base 4096 - 495, surface pitch 880) and the function that
# writes the strip size into the surfaces (_actualWidth / _actualHeight). src/hooks/
# scene_size_hook.cpp lowers r5 to 2048 when the pass fits into a 4096-tile EDRAM the SDK runs, so
# the pass goes untiled; r5 is not read on that path.
[[midasm_hook]]
address = 0x82513A08
name = "EdramTilingHook"
registers = ["r5"]

# 0x8251460C follows subfic r9,r11,0x800 in sub_82514448, the per-render-pass EDRAM allocation:
# colour surfaces go one after the other from tile 0, the depth surface to the top, 2048 minus its
# tiles (r11), stored by the stw r9,0x80(r23) two instructions on. Found from the Xenon surface
# reflection fields (_edramBase +0x80, _edramTileCount +0x84) and XGSurfaceSize / XGSetSurfaceHeader
# (sub_82F5A0D8 / sub_82F5B778) up to their only allocating caller. src/hooks/scene_size_hook.cpp
# puts the depth at the top of a 4096-tile EDRAM instead when the SDK runs one
# (edram_tile_count = 4096, which a larger scene_size needs); r9 is only read by that store.
[[midasm_hook]]
address = 0x8251460C
name = "EdramDepthBaseHook"
registers = ["r9", "r11"]

# 0x82A4A828 is CPlayerJumpComponent's per-frame "stuck while falling" check: a falling player who
# moved less than CPlayerSystemData._stuckFallingDistanceThreshold (+0x5C) since the last frame
# runs a timer, and after _stuckFallingTime (+0x60) is put back (sub_82A4A5D0 with 4). Found from
# the reflection field names and offset tables (0x820AF9C8 / 0x820AFA84) and the classes' RTTI;
# this is the one function reading both fields and the component's timer (+0x8C). The threshold
# is per frame, i.e. tuned for 30 FPS. src/hooks/stuck_falling_hook.cpp reads the frame time at
# the entry (r30 is still the only caller's update context, sub_82A4A950, with dt at +0x14; r3 =
# component; only reads), scales the threshold in f13 by 30 x dt (at most 1) at 0x82A4A8A0
# (fmuls f11,f13,f12 multiplies it next; nothing else uses f13 after it; f0 = squared distance and
# r30 = CPlayerSystemData are only read, for the log), and logs the put-back at 0x82A4A8D8
# (f1 = timer, f31 = limit; only reads). Same fix as Cemu's Wii U pack.
[[midasm_hook]]
address = 0x82A4A828
name = "StuckFallingCheckHook"
registers = ["r3", "r30"]

[[midasm_hook]]
address = 0x82A4A8A0
name = "StuckFallingThresholdHook"
registers = ["f0", "f13", "f12", "r30", "r31"]

[[midasm_hook]]
address = 0x82A4A8D8
name = "StuckFallingRespawnHook"
registers = ["f1", "f31"]

# 0x82BA32C0 is where both paths of sub_82BA31A0 meet after filling CBloomParametersAttr (r28)
# from the level's CBloomData (or with 1.0). Found with a write watch on the attr's inner scale
# (+0x14), whose only writer this is. src/hooks/post_effects_hook.cpp scales the inner and outer
# scales (+0x14, +0x18) by bloom_strength; it only changes the two values the attr is about to
# hand to the shader (the next call, sub_824368D0, submits it), and does nothing at 1.
[[midasm_hook]]
address = 0x82BA32C0
name = "BloomStrengthHook"
registers = ["r28"]

# 0x82BA35CC: sub_82BA3390 holds the motion blur exposure time in f0 (CMotionBlurData +0x0C, or 0
# on a camera cut) and stores it into the motion blur attr (+0x90) in the next two instructions.
# Found with read watches on CMotionBlurData's fields. The hook scales f0 by motion_blur_strength;
# 0 is the value the game itself uses for "no blur", and f0 is not used after the store.
[[midasm_hook]]
address = 0x82BA35CC
name = "MotionBlurStrengthHook"
registers = ["f0"]

# 0x82B993A4 is the call in sub_82B992A8 (the renderer's per-frame scene camera set-up) to the
# perspective builder sub_824906D8(r3 = projection matrix, f1 = horizontal FOV, f2 = vertical FOV,
# f3 = aspect, f4 = near, f5 = far; radians). Found from the camera's reflection fields (_fov,
# _aspect, _projectionMatrix) and a read watch on the live camera's _aspect in the hub.
# src/hooks/ultrawide_hook.cpp widens f3 (and f1, keeping the vertical FOV) for a window wider
# than 16:9 with ultrawide_fov on; it only changes this call's arguments.
[[midasm_hook]]
address = 0x82B993A4
name = "UltrawideFovHook"
registers = ["f1", "f2", "f3"]

# Jump tables the analyzer under-counted, so the generated switch trapped (__builtin_trap, host
# exception 0xC000001D) on the missing indices. All four tables sit directly after their bctr;
# entries were read from the image with Ghidra until the first word that is no longer a code
# address next to the bctr. Candidates came from scanning generated/ for switches whose first case
# label lies further behind the table than the emitted case count allows.

# Bink 2 bit-stream decoder in sub_83094710. On this path the index is (bits & 3) + 7, i.e. 7..10,
# with no bounds check, so codegen saw 4 entries. Found from the crash when a KB2f video plays
# (Tutorial_B_Intro.bk2 after the first tutorial fight); the table ends where case 0's code begins.
[[switch_tables]]
address = 0x830947BC
register = 10
labels = [0x830947EC, 0x83094800, 0x83094850, 0x830948A0, 0x830948F0, 0x83094940, 0x83094988, 0x830949D8, 0x83094A28, 0x83094AA4, 0x83094B20]

# Same decoder structure, detected with 8 entries; it has 11 (the same fix GiantsRecomp needs for
# its Bink decoder, register 19 there too).
[[switch_tables]]
address = 0x83090868
register = 19
labels = [0x83090898, 0x830908C0, 0x83090AA8, 0x83090C90, 0x83090E78, 0x83091060, 0x83091248, 0x83091430, 0x83091618, 0x8309184C, 0x83091A80]

# Same decoder structure, detected with 8 entries; it has 11.
[[switch_tables]]
address = 0x83093150
register = 20
labels = [0x83093180, 0x83093190, 0x8309331C, 0x830934A8, 0x83093634, 0x830937C0, 0x8309394C, 0x83093AD8, 0x83093C64, 0x83093E14, 0x83093FC4]

# Bounds-checked switch (cmplwi cr6,r11,39 / bgt 0x8247A9F0, then mr r10,r11): 40 entries, codegen
# emitted 8. Not yet identified what the function does; found by the scan, not by a crash.
[[switch_tables]]
address = 0x8247A658
register = 10
labels = [0x8247A890, 0x8247A6FC, 0x8247A710, 0x8247A724, 0x8247A7A0, 0x8247A7D4, 0x8247A808, 0x8247A81C, 0x8247A740, 0x8247A81C, 0x8247A950, 0x8247A950, 0x8247A9F0, 0x8247A9F0, 0x8247A9F0, 0x8247A9F0, 0x8247A9F0, 0x8247A9F0, 0x8247A9F0, 0x8247A9F0, 0x8247A9F0, 0x8247A858, 0x8247A858, 0x8247A858, 0x8247A858, 0x8247A858, 0x8247A858, 0x8247A858, 0x8247A858, 0x8247A858, 0x8247A9F0, 0x8247A89C, 0x8247A89C, 0x8247A89C, 0x8247A89C, 0x8247A89C, 0x8247A89C, 0x8247A89C, 0x8247A89C, 0x8247A89C]
